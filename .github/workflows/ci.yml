name: public-gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  public-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Restore exact web dependencies without lifecycle scripts
        working-directory: Web
        run: npm ci --offline=false --ignore-scripts --no-audit --no-fund
      - name: Run complete public automated gate
        run: scripts/test.sh
      - name: Verify and regenerate committed web resources
        run: |
          scripts/verify-dependencies.sh
          scripts/bundle-web.sh
      - name: Build and verify signed application boundary
        run: |
          scripts/build.sh
          scripts/verify-dependencies.sh
          codesign --verify --deep --strict ".generated/Miller Avatar Alpha.app"
          codesign -d --entitlements :- ".generated/Miller Avatar Alpha.app"
          scripts/test-signed-boundary.sh ".generated/Miller Avatar Alpha.app"
      - name: Exclude private and generated avatar material
        run: |
          ! find . \( -path './.git' -o -path './.build' -o -path './.generated' -o -path './Web/node_modules' \) -prune -o -type f \( -name '*.vrm' -o -name '*.glb' -o -name '*.vrma' -o -name '*.png' -o -name '*.jpeg' -o -name '*.jpg' -o -name '*.heic' -o -name '*.webp' \) -print -quit | grep -q .
          ! find .generated -type f \( -name '*.vrm' -o -name '*.glb' -o -name '*.vrma' -o -name '*.png' -o -name '*.jpeg' -o -name '*.jpg' -o -name '*.heic' -o -name '*.webp' \) -print -quit | grep -q .
          ! grep -R -n -E '/Users/|/private/var/|MILLER_AVATAR_PRIVATE_FIXTURE_ROOT' Resources .generated
      - name: Verify reproducible source outputs and bounded cleanup
        run: |
          git diff --exit-code -- Resources/Web Resources/build-manifest.json
          scripts/clean.sh
          test ! -e .build
          test ! -e .generated
          test ! -e Web/.build
          test ! -e Web/node_modules
          git diff --check
